[package]
name = "icon-toolkit-cli"
version = "1.0.0"
edition = "2021"
description = "CLI tool for generating, converting, and AI-synthesizing icons from a single source"

[[bin]]
name = "icon-toolkit"
path = "src/main.rs"

[dependencies]
icon-toolkit-core = { path = "../crates/icon-toolkit-core" }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"

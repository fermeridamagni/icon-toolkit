[package]
name = "icon-toolkit-core"
version = "1.0.0"
edition = "2021"
description = "Core library for icon generation, conversion, and AI icon synthesis"

[dependencies]
image = "0.25"
ico = "0.3"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.8"
